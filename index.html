<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Formular mit Glitch-Hintergrund</title>
    <style>
        body {
            /* Das Bild liegt im selben Verzeichnis im Repository */
            background-image: url('image3A19020_Glitch.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 100%;
            max-width: 640px;
            background: rgba(255, 255, 255, 0.90);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            overflow: hidden;
            padding: 10px;
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- Hier den eigenen Embed-Link von Google Forms einsetzen -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc.../viewform?embedded=true" width="640" height="800" frameborder="0" marginheight="0" marginwidth="0">Wird geladen…</iframe>
    </div>

</body>
</html>
